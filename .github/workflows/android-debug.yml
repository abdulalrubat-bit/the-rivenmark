name: Debug APK

# The APK is built in CI rather than committed: a binary in git goes stale the
# moment index.html changes, and this way every push produces one that provably
# matches the source it was built from.
# main only on push: a claude/** branch with an open PR was matching both this
# and pull_request, so every PR built the APK twice for the same commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # packages: only platform-tools. The action's default list also names
      # the legacy `tools` package, which the runner's cmdline-tools no longer
      # carry -- sdkmanager exits 1 on it, and every Android build died in
      # setup before reaching Gradle. Gradle fetches the platform and build
      # tools it needs itself; the licences the action accepts cover that.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # The APK carries the Phaser build, which is bundled with esbuild and
      # whose atlas is packed with pngjs -- neither of which exists in a fresh
      # checkout. Without this the first run failed with ERR_MODULE_NOT_FOUND
      # before it ever reached Gradle.
      - name: Install the Phaser build's tools
        working-directory: phaser
        run: npm ci --no-audit --no-fund

      - name: Build the game and copy it into assets
        run: node android/sync-assets.js

      - name: Assemble
        working-directory: android
        run: gradle --no-daemon assembleDebug

      # The APK must carry exactly what sync-assets.js just built from source,
      # file for file. It used to be one hash of one self-contained HTML file;
      # the Phaser build is thirteen files, and checking only index.html would
      # pass an APK with a stale bundle or no atlas in it at all.
      - name: Check the APK carries the game, every file of it
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          src=android/app/src/main/assets
          n=0
          for f in "$src"/*; do
            b=$(basename "$f")
            a=$(sha256sum "$f" | cut -d' ' -f1)
            unzip -l "$apk" | grep -q "assets/$b" \
              || { echo "::error::APK is missing assets/$b"; exit 1; }
            c=$(unzip -p "$apk" "assets/$b" | sha256sum | cut -d' ' -f1)
            [ "$a" = "$c" ] || { echo "::error::assets/$b in the APK differs from source"; exit 1; }
            n=$((n+1))
          done
          echo "$n asset(s) verified against source"
          # The three that would leave a black screen if they went missing.
          for must in index.html bundle.js atlas.png; do
            unzip -l "$apk" | grep -q "assets/$must" \
              || { echo "::error::APK has no assets/$must"; exit 1; }
          done
          ls -lh "$apk"

      - uses: actions/upload-artifact@v4
        with:
          name: the-rivenmark-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
