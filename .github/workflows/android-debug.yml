name: Debug APK

# The APK is built in CI rather than committed: a binary in git goes stale the
# moment index.html changes, and this way every push produces one that provably
# matches the source it was built from.
# main only on push: a claude/** branch with an open PR was matching both this
# and pull_request, so every PR built the APK twice for the same commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: android-actions/setup-android@v3

      - name: Build the debug page and copy it into assets
        run: node android/sync-assets.js

      - name: Assert the packaged page matches the generated one
        run: |
          a=$(sha256sum debug.html | cut -d' ' -f1)
          b=$(sha256sum android/app/src/main/assets/index.html | cut -d' ' -f1)
          echo "debug.html      $a"
          echo "packaged asset  $b"
          [ "$a" = "$b" ] || { echo "::error::packaged asset does not match debug.html"; exit 1; }

      - name: Assemble
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Check the APK carries the game
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$apk" | grep -q 'assets/index.html' \
            || { echo "::error::APK has no game asset"; exit 1; }
          in_apk=$(unzip -p "$apk" assets/index.html | sha256sum | cut -d' ' -f1)
          src=$(sha256sum debug.html | cut -d' ' -f1)
          [ "$in_apk" = "$src" ] || { echo "::error::APK asset differs from debug.html"; exit 1; }
          ls -lh "$apk"

      - uses: actions/upload-artifact@v4
        with:
          name: the-rivenmark-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
