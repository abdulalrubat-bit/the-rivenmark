name: Release AAB

# The bundle Play takes. Deliberately NOT on every push: an .aab is uploaded
# once under a versionCode that can never be reused, so it is built when
# someone asks for it or when a version tag says a release is happening.
#
# WHY A BUNDLE AND NOT AN APK. Play stores an app bundle and generates the APKs
# each device actually downloads, so this is the only artefact the console will
# take for a new release. `android-debug.yml` still builds an APK, because an
# APK is the thing you can sideload onto a phone and play.
#
# THIS REPLACED A GENERIC TEMPLATE, and the differences are all this repo's
# shape rather than taste:
#
#   * There is no `gradlew` here. `chmod +x gradlew && ./gradlew` fails on the
#     first line; the runner's own `gradle` is what the debug workflow uses.
#   * The Gradle project root is `android/`, not the repo root, so every path
#     is relative to that.
#   * app/src/main/assets/ is GENERATED and gitignored. On a fresh checkout it
#     does not exist, so a build that does not regenerate it ships a bundle
#     with no game in it -- a WebView opening a page that is not there. That is
#     what `syncGameAssets` is for, and it needs Node and phaser/node_modules
#     to exist before Gradle runs.
#   * Signing is done by Gradle from properties, not bolted on afterwards, so
#     what the bundle is signed with is decided in one place.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name shown to players (e.g. 0.9.0). Blank keeps build.gradle''s.'
        required: false
        type: string
      version_code:
        description: 'versionCode. Blank uses 1000 + this workflow''s run number.'
        required: false
        type: string
      allow_unsigned:
        description: 'Build even with no signing secrets. The bundle will NOT be uploadable to Play.'
        required: false
        default: false
        type: boolean
  push:
    tags: ['v*']

# One release build at a time. Two runs racing would burn two versionCodes for
# one release and leave you guessing which artefact was which.
concurrency:
  group: release-aab
  cancel-in-progress: false

jobs:
  # The game has to PLAY before it is packaged (the analysis' R02). Packaging
  # proves the APK carries the build; it says nothing about whether the build
  # works. These are the rules a release must not break -- saves that cannot
  # crash the game, the attack's contract, Hardcore, getting out, the ladder,
  # the stash -- and the two smoke checks for booting and for a save problem
  # never being silent. The full suites stay a local and manual job: they
  # take the better part of an hour.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install the Phaser build's tools
        working-directory: phaser
        run: npm ci --no-audit --no-fund
      - name: Chromium for the suites
        working-directory: phaser
        run: npx playwright install --with-deps chromium
      - name: Pack the atlas the game loads
        working-directory: phaser
        run: npm run atlas
      - name: The rules a release must not break
        run: NODE_PATH=$PWD/phaser/node_modules node tools/run-suites.js saves controls hardcore extract ladder stash
      - name: It boots, and a save problem is never silent
        working-directory: phaser
        run: npm run smoke:boot && npm run smoke:savenotice

  aab:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # packages: only platform-tools. The action's default list also names
      # the legacy `tools` package, which the runner's cmdline-tools no longer
      # carry -- sdkmanager exits 1 on it, and every Android build died in
      # setup before reaching Gradle. Gradle fetches the platform and build
      # tools it needs itself; the licences the action accepts cover that.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # Gradle's syncGameAssets task runs android/sync-assets.js, which runs the
      # Phaser deploy -- esbuild and pngjs, neither of which exists in a fresh
      # checkout. This has to come before Gradle, not after: without it the
      # build dies with ERR_MODULE_NOT_FOUND before it reaches a single task.
      - name: Install the Phaser build's tools
        working-directory: phaser
        run: npm ci --no-audit --no-fund

      # NOTE: there is deliberately no `node android/sync-assets.js` step. The
      # app's preBuild depends on syncGameAssets, which does it -- so this
      # workflow also proves that wiring rather than working around it. A
      # release built from a stale or absent assets/ is the exact failure that
      # made the task exist.

      # The version, resolved in one place so every later step and the artefact
      # name agree with what actually went into the manifest.
      #
      # ON THE DEFAULT. Play accepts a versionCode exactly once and refuses a
      # repeat AFTER the upload. `run_number` only ever increases, and the
      # 1000 offset puts it clear of the 2 that is build.gradle's default. It
      # is a default and not a rule: renaming or recreating this workflow file
      # resets run_number, which is precisely why the input exists.
      #
      # THE INPUTS ARRIVE AS ENVIRONMENT, NOT AS TEXT IN THE SCRIPT. A
      # `${{ inputs.x }}` inside `run:` is pasted into the script before bash
      # sees it, so a version name with a quote in it was shell code. They are
      # checked here as well, because both end up as Gradle flags and in a
      # manifest, and neither is a place for anything but a version.
      - name: Work out the version
        id: ver
        env:
          IN_CODE: ${{ inputs.version_code }}
          IN_NAME: ${{ inputs.version_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          code="$IN_CODE"
          [ -n "$code" ] || code=$(( 1000 + RUN_NUMBER ))
          name="$IN_NAME"
          if [ -z "$name" ] && [ "${GITHUB_REF_TYPE}" = tag ]; then
            name="${GITHUB_REF_NAME#v}"          # v0.9.1 -> 0.9.1
          fi
          [[ "$code" =~ ^[1-9][0-9]{0,9}$ ]] \
            || { echo "::error::versionCode must be a positive whole number, got '$code'."; exit 1; }
          [ -z "$name" ] || [[ "$name" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]{0,39}$ ]] \
            || { echo "::error::versionName may only hold letters, digits and . _ + -"; exit 1; }
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          # No apostrophe inside ${name:-...}: bash reads it as an unclosed
          # quote, and this line was a syntax error that failed the step on
          # every run -- the workflow had never been run, so nothing said so.
          echo "versionCode $code, versionName ${name:-from build.gradle}"

      # THE KEY NEVER TOUCHES THE WORKSPACE.
      #
      # It is written under RUNNER_TEMP rather than into the checkout, so that
      # no glob, no artefact upload and no `git add -A` in a later step can
      # carry it anywhere. It is removed again at the end whatever happens.
      #
      # A missing secret is not an error here -- build.gradle leaves the bundle
      # unsigned rather than falling back to the debug key, and the check after
      # the build is what decides whether that is acceptable.
      - name: Unpack the signing key
        id: key
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ]; then
            echo "have=no" >> "$GITHUB_OUTPUT"
            echo "::warning::No KEYSTORE_BASE64 secret — this bundle will be UNSIGNED."
            exit 0
          fi
          printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/rivenmark.jks"
          # Prove it decoded to a keystore before Gradle fails with something
          # less obvious. The alias is not printed: it is a secret's value.
          keytool -list -keystore "$RUNNER_TEMP/rivenmark.jks" \
                  -storepass:env STORE_PW >/dev/null \
            || { echo "::error::The keystore secret did not decode, or KEYSTORE_PASSWORD is wrong."; exit 1; }
          echo "have=yes" >> "$GITHUB_OUTPUT"

      - name: Bundle
        working-directory: android
        env:
          VER_CODE: ${{ steps.ver.outputs.code }}
          VER_NAME: ${{ steps.ver.outputs.name }}
          HAVE_KEY: ${{ steps.key.outputs.have }}
          STORE_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PW: ${{ secrets.KEY_PASSWORD }}
        run: |
          # An array, so each flag is exactly one argument whatever is in it --
          # a password with a space or a quote in it used to split or break.
          args=(--no-daemon --console=plain "-Privenmark.versionCode=$VER_CODE")
          [ -n "$VER_NAME" ] && args+=("-Privenmark.versionName=$VER_NAME")
          if [ "$HAVE_KEY" = yes ]; then
            args+=("-Privenmark.keystore=$RUNNER_TEMP/rivenmark.jks"
                   "-Privenmark.storePassword=$STORE_PW"
                   "-Privenmark.keyAlias=$KEY_ALIAS"
                   "-Privenmark.keyPassword=$KEY_PW")
          fi
          gradle "${args[@]}" :app:bundleRelease

      # IS IT ACTUALLY SIGNED? This is the whole reason the step exists, and it
      # is not the check you would write first.
      #
      # An unsigned bundle comes out under the SAME NAME, app-release.aab, so
      # the filename says nothing. `jarsigner -verify` exits 0 for both -- it
      # prints "jar verified." for one and "no manifest." for the other and
      # returns success either way -- so its exit code is not a gate. And
      # `-strict` exits 4 on a perfectly good self-signed release key, so it is
      # not a gate either. Both measured on this repo's own output.
      #
      # What does separate them is the signature block: two META-INF entries
      # (.SF and .RSA) when signed, none when not.
      - name: Check the bundle is signed
        env:
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned }}
        run: |
          aab=android/app/build/outputs/bundle/release/app-release.aab
          [ -f "$aab" ] || { echo "::error::No bundle at $aab"; exit 1; }
          blocks=$(unzip -l "$aab" | grep -cE 'META-INF/.*\.(SF|RSA|DSA|EC)$' || true)
          verdict=$(jarsigner -verify "$aab" 2>/dev/null | tr -d '\r' | grep -E 'jar verified|no manifest' | head -1)
          echo "signature blocks: $blocks; jarsigner says: ${verdict:-nothing}"
          if [ "$blocks" -gt 0 ] && [ "$verdict" = "jar verified." ]; then
            echo "SIGNED" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$ALLOW_UNSIGNED" = "true" ]; then
            echo "::warning::UNSIGNED bundle, allowed by the allow_unsigned input. Play will not take it."
            echo "UNSIGNED — cannot be uploaded to Play" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::The bundle is not signed. Set KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD, or re-run with allow_unsigned to get an unsigned build on purpose."
            exit 1
          fi

      # Same discipline as the debug APK: what shipped must be what was built
      # from source, file for file. The paths differ -- a bundle keeps the base
      # module's assets under base/assets/, not assets/ -- and checking only
      # index.html would pass a bundle with a stale core or no atlas at all.
      #
      # This is also what catches the worst failure available here: assets/ is
      # generated and gitignored, so a build that did not regenerate it would
      # produce a perfectly valid, perfectly signed bundle containing no game.
      - name: Check the bundle carries the game, every file of it
        run: |
          aab=android/app/build/outputs/bundle/release/app-release.aab
          src=android/app/src/main/assets
          [ -d "$src" ] \
            || { echo "::error::$src does not exist — nothing regenerated the game"; exit 1; }
          n=0
          for f in "$src"/*; do
            b=$(basename "$f")
            a=$(sha256sum "$f" | cut -d' ' -f1)
            unzip -l "$aab" | grep -q "base/assets/$b" \
              || { echo "::error::bundle is missing base/assets/$b"; exit 1; }
            c=$(unzip -p "$aab" "base/assets/$b" | sha256sum | cut -d' ' -f1)
            [ "$a" = "$c" ] || { echo "::error::base/assets/$b in the bundle differs from source"; exit 1; }
            n=$((n+1))
          done
          echo "$n asset(s) verified against source"
          [ "$n" -gt 0 ] || { echo "::error::no assets at all — the bundle has no game in it"; exit 1; }
          # The three that would ship a black screen if they went missing.
          for must in index.html bundle.js atlas.png; do
            unzip -l "$aab" | grep -q "base/assets/$must" \
              || { echo "::error::bundle has no base/assets/$must"; exit 1; }
          done

      # The manifest inside a bundle is protobuf, so it is read from the merged
      # manifest Gradle wrote on the way rather than parsed back out of the zip.
      # Without this a mistyped property would silently ship build.gradle's
      # default versionCode, and Play would refuse the upload for a reason that
      # points at the wrong thing.
      - name: Check the version that actually went in
        run: |
          m=$(find android/app/build/intermediates -name AndroidManifest.xml -path '*bundle_manifest*release*' | head -1)
          [ -n "$m" ] || { echo "::error::no merged release manifest to check"; exit 1; }
          got=$(grep -o 'versionCode="[0-9]*"' "$m" | head -1 | tr -dc 0-9)
          want='${{ steps.ver.outputs.code }}'
          [ "$got" = "$want" ] \
            || { echo "::error::bundle carries versionCode $got, expected $want"; exit 1; }
          {
            echo "versionCode **$got**"
            grep -o 'versionName="[^"]*"' "$m" | head -1
            ls -lh android/app/build/outputs/bundle/release/app-release.aab
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: the-rivenmark-release-aab-${{ steps.ver.outputs.code }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          # A release artefact is worth keeping longer than the 90-day default
          # is worth relying on, but it is not the archive -- Play is.
          retention-days: 90

      # Always, including on a failed build: a key left on a runner is a key on
      # a machine you do not own.
      - name: Shred the key
        if: always()
        run: rm -f "$RUNNER_TEMP/rivenmark.jks"
