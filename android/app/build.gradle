plugins { id 'com.android.application' }

android {
    namespace 'com.rivenmark.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.rivenmark.game"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "0.9.0"
    }

    /* SIGNING, WITHOUT A KEY IN THE REPOSITORY.
     *
     * Read from Gradle properties, which come off the command line or
     * ~/.gradle/gradle.properties -- never from a file in the tree. A signing
     * key committed next to the source is a signing key anyone who clones the
     * repository can publish an update with, and it cannot be un-published.
     *
     * If the properties are absent the release build is left UNSIGNED rather
     * than quietly falling back to the debug key. An APK that says release and
     * carries a debug signature is the one that gets uploaded by mistake, and
     * Play rejects it after the fact rather than before.
     */
    def ksPath = project.findProperty('rivenmark.keystore')
    signingConfigs {
        if (ksPath) {
            release {
                storeFile file(ksPath)
                storePassword project.findProperty('rivenmark.storePassword')
                keyAlias project.findProperty('rivenmark.keyAlias')
                keyPassword project.findProperty('rivenmark.keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            minifyEnabled false
        }
        release {
            /* NOT shrunk, deliberately. There is almost no Java here -- one
             * activity and a WebView -- so R8 has nothing worth removing, and
             * what it would remove is exactly what it cannot see: the
             * @JavascriptInterface methods the page calls by name across the
             * bridge. Shrinking a shell like this trades nothing for a class
             * of bug that only appears in the build you ship.
             */
            minifyEnabled false
            shrinkResources false
            signingConfig ksPath ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// AndroidX drags in kotlin-stdlib-jdk7/jdk8, whose classes were folded into
// kotlin-stdlib itself at Kotlin 1.8 -- leaving both on the classpath fails
// dexing with several hundred duplicate-class errors. The shims are empty now,
// so dropping them is the fix rather than pinning versions against each other.
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    // WebViewAssetLoader: serves assets/ over an https origin instead of
    // file://, which the Phaser build needs because it fetches atlas.json and
    // XHR from a file:// origin is refused by every current WebView.
    implementation 'androidx.webkit:webkit:1.11.0'
}
