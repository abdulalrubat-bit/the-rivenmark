plugins { id 'com.android.application' }

android {
    namespace 'com.rivenmark.game'
    compileSdk 34

    /* THE VERSION, AND WHY IT CAN BE OVERRIDDEN FROM OUTSIDE.
     *
     * Play accepts a versionCode exactly once. Upload a bundle carrying one it
     * has already seen and it is refused after the upload, not before -- so a
     * number hard-coded here means every release needs a commit whose only
     * purpose is to increment an integer, and means two builds off the same
     * commit collide. The default stays in the file so a local build has a
     * sane number; CI passes -Privenmark.versionCode with something that
     * cannot repeat.
     *
     * versionName is the human half and is allowed to repeat, so it is only
     * overridden when there is something to say.
     */
    /* Resolved above the block and ASSIGNED, not called. Written as
     * `versionCode (expr) as Integer`, Groovy reads it as `versionCode(expr)`
     * and casts the RETURN -- so the setter got a String, the cast got null,
     * and the build died with "Value is null" pointing at the line rather than
     * at the parse. */
    def verCode = (project.findProperty('rivenmark.versionCode') ?: '2') as Integer
    def verName = (project.findProperty('rivenmark.versionName') ?: '0.9.0') as String

    defaultConfig {
        applicationId "com.rivenmark.game"
        minSdk 24
        targetSdk 34
        versionCode = verCode
        versionName = verName
    }

    /* SIGNING, WITHOUT A KEY IN THE REPOSITORY.
     *
     * Read from Gradle properties, which come off the command line or
     * ~/.gradle/gradle.properties -- never from a file in the tree. A signing
     * key committed next to the source is a signing key anyone who clones the
     * repository can publish an update with, and it cannot be un-published.
     *
     * If the properties are absent the release build is left UNSIGNED rather
     * than quietly falling back to the debug key. An APK that says release and
     * carries a debug signature is the one that gets uploaded by mistake, and
     * Play rejects it after the fact rather than before.
     */
    def ksPath = project.findProperty('rivenmark.keystore')
    signingConfigs {
        if (ksPath) {
            release {
                storeFile file(ksPath)
                storePassword project.findProperty('rivenmark.storePassword')
                keyAlias project.findProperty('rivenmark.keyAlias')
                keyPassword project.findProperty('rivenmark.keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            minifyEnabled false
        }
        release {
            /* NOT shrunk, deliberately. There is almost no Java here -- one
             * activity and a WebView -- so R8 has nothing worth removing. And
             * the day a JS-to-native bridge is added (the ad SDK in
             * docs/GAME.md would be one), R8 would strip exactly what it
             * cannot see: @JavascriptInterface methods the page calls by name.
             * Shrinking a shell like this trades nothing for a class of bug
             * that only appears in the build you ship.
             */
            minifyEnabled false
            shrinkResources false
            signingConfig ksPath ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

/* THE ASSETS ARE BUILT BY THE BUILD, NOT BY WHOEVER REMEMBERS.
 *
 * app/src/main/assets/ is generated in full by ../sync-assets.js, which wipes
 * it and runs the Phaser deploy. That script was correct and complete. What
 * was missing is this: nothing made Gradle run it. So `assembleRelease` on a
 * checkout where nobody had run it by hand packaged whatever happened to be
 * sitting in that directory, and the directory is gitignored, so there was
 * nothing to notice and nothing to diff.
 *
 * That was not hypothetical. It was the state of this repository: the assets
 * on disk still carried a core.js with the auto-fire the game had already had
 * deleted, and an index.html with no title card. An APK cut at that moment
 * would have shipped a build of the game that no longer existed, and the only
 * way to find out would have been to play it on a phone.
 *
 * Never up to date, deliberately. Its real inputs are index.html, the whole
 * of phaser/src and the whole of art/ -- declaring those is a list that goes
 * stale in precisely the way this task exists to prevent, and the script it
 * calls is four seconds and does its own change detection downstream.
 *
 * -Privenmark.skipAssetSync=true opts out, for iterating on the Java shell
 * without Node installed. An opt-out you have to type is not a step anyone
 * forgets; a step you have to remember is.
 */
def skipAssetSync = project.findProperty('rivenmark.skipAssetSync') == 'true'
def nodeExe = project.findProperty('rivenmark.node') ?: 'node'

tasks.register('syncGameAssets') {
    description 'Rebuilds app/src/main/assets/ from the Phaser build.'
    outputs.upToDateWhen { false }
    doLast {
        if (skipAssetSync) {
            logger.lifecycle('syncGameAssets: skipped by -Privenmark.skipAssetSync — ' +
                             'this APK carries whatever is already in assets/.')
            return
        }
        def script = new File(rootProject.projectDir, 'sync-assets.js')
        if (!script.isFile()) {
            throw new GradleException('android/sync-assets.js is missing — cannot build ' +
                                      'the assets this APK is made of.')
        }
        try {
            providers.exec {
                commandLine nodeExe, script.absolutePath
            }.standardOutput.asText.get().eachLine { logger.lifecycle('  ' + it) }
        } catch (Exception e) {
            throw new GradleException(
                'Could not run `' + nodeExe + ' ' + script + '`.\n' +
                'The APK\'s assets are generated by that script and there is no ' +
                'fallback: what is on disk may be any age.\n' +
                'Install Node, or pass -Privenmark.node=/path/to/node, or build ' +
                'with -Privenmark.skipAssetSync=true if you know the assets are ' +
                'already current.', e)
        }
    }
}

tasks.named('preBuild') { dependsOn 'syncGameAssets' }

// AndroidX drags in kotlin-stdlib-jdk7/jdk8, whose classes were folded into
// kotlin-stdlib itself at Kotlin 1.8 -- leaving both on the classpath fails
// dexing with several hundred duplicate-class errors. The shims are empty now,
// so dropping them is the fix rather than pinning versions against each other.
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    // WebViewAssetLoader: serves assets/ over an https origin instead of
    // file://, which the Phaser build needs because it fetches atlas.json and
    // XHR from a file:// origin is refused by every current WebView.
    implementation 'androidx.webkit:webkit:1.11.0'
}
